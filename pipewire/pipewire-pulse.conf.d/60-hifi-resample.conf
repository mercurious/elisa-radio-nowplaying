# Highest-quality resampler for PulseAudio clients (Elisa via VLC's pulse output,
# browsers, ...). Only used when a stream can't play at the DAC's current rate,
# e.g. a 44.1 kHz track while another app holds the output at 48 kHz.
# PipeWire's default is 4; 10 is the maximum. CPU cost is negligible for stereo.
#
# Install: cp to ~/.config/pipewire/pipewire-pulse.conf.d/
#          systemctl --user restart pipewire-pulse
stream.properties = {
    resample.quality = 10
}
